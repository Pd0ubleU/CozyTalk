name: mobile
description: "CozyTalk - A cozy chat application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  shared_preferences: ^2.2.2

  # Firebase
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.4.0
  firebase_database: ^12.3.0
  cloud_functions: ^6.2.0
  firebase_storage: ^13.4.0
  firebase_crashlytics: ^5.2.2
  firebase_remote_config: ^6.5.1

  # Local database — word filter feature (Android; web reads banned_words.json via rootBundle)
  # Gated by content_filtering_enabled Remote Config flag (default false)
  sqflite: ^2.3.3

  # Auth
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.3.0

  # Media
  image_picker: ^1.1.2
  cross_file: ^0.3.4+2

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  cryptography: ^2.7.0
  flutter_svg: ^2.0.17
  google_fonts: ^8.1.0
  http: ^1.6.0
  url_launcher: ^6.3.2

  cached_network_image: ^3.4.0
  connectivity_plus: ^7.1.1

  # Jukebox
  web: ^1.0.0
  webview_flutter: ^4.0.0
  webview_flutter_web: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  integration_test:
    sdk: flutter

dependency_overrides:
  test_api: 0.7.10
  path_provider_foundation: 2.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/icons/
    - assets/images/moods/
    - assets/images/dressup/
    - assets/images/cards/
    - assets/images/tuktuk/
    - assets/icebreaker-questions.json
    - assets/banned_words.json  # word filter seed; loaded into SQLite on Android, read directly on web
